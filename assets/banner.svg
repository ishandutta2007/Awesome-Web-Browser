<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glassmorphism Card Fill -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(-10px, 15px); opacity: 0.7; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes shimmer {
      0% { stop-color: #3b82f6; }
      50% { stop-color: #ec4899; }
      100% { stop-color: #3b82f6; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite 2s; transform-origin: 1000px 200px; }
    .floating-card { animation: floatCard 6s ease-in-out infinite; }
    .floating-card-2 { animation: floatCard 7s ease-in-out infinite 1.5s; }
    
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 52px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #9ca3af;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e0e7ff;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGradient)" />

  <!-- Dynamic Background Glowing Orbs (Behind content) -->
  <circle class="orb-1" cx="200" cy="80" r="140" fill="#3b82f6" opacity="0.35" filter="url(#glow)" />
  <circle class="orb-2" cx="1000" cy="220" r="160" fill="#8b5cf6" opacity="0.3" filter="url(#glow)" />

  <!-- Animated Decorative Grid Lines -->
  <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <path d="M300,0 V300 M600,0 V300 M900,0 V300" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Decorative Browser UI Frame (Background Graphic) -->
  <g transform="translate(780, 45)" class="floating-card">
    <rect width="360" height="210" rx="12" fill="url(#glassGradient)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
    <rect width="360" height="36" rx="12" fill="#ffffff" fill-opacity="0.05" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="52" cy="18" r="5" fill="#10b981" opacity="0.8" />
    <rect x="75" y="10" width="200" height="16" rx="8" fill="#ffffff" fill-opacity="0.1" />

    <!-- Mini Browser Content Visualization -->
    <rect x="25" y="56" width="140" height="60" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4" />
    <rect x="180" y="56" width="155" height="60" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4" />
    <rect x="25" y="128" width="310" height="65" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" />
  </g>

  <!-- Engine Badges (Middle Layer) -->
  <g transform="translate(60, 220)" class="floating-card-2">
    <!-- Chromium -->
    <rect x="0" y="0" width="105" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1" />
    <text x="52" y="21" text-anchor="middle" class="badge-text">⚡ Chromium</text>

    <!-- Gecko -->
    <rect x="115" y="0" width="90" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#f97316" stroke-width="1" />
    <text x="160" y="21" text-anchor="middle" class="badge-text">🦊 Gecko</text>

    <!-- WebKit -->
    <rect x="215" y="0" width="95" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#06b6d4" stroke-width="1" />
    <text x="262" y="21" text-anchor="middle" class="badge-text">🧭 WebKit</text>

    <!-- Servo -->
    <rect x="320" y="0" width="85" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ef4444" stroke-width="1" />
    <text x="362" y="21" text-anchor="middle" class="badge-text">⚙️ Servo</text>

    <!-- Ladybird -->
    <rect x="415" y="0" width="100" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ec4899" stroke-width="1" />
    <text x="465" y="21" text-anchor="middle" class="badge-text">🐞 Ladybird</text>
  </g>

  <!-- Accent Gradient Top Line -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGradient)" />

  <!-- Foreground Title and Subtitle (Z-Index Top - Never Obscured) -->
  <g transform="translate(60, 105)">
    <!-- Globe Icon -->
    <text x="0" y="0" font-size="46" fill="#ffffff">🌐</text>
    <!-- Title -->
    <text x="60" y="-4" class="title-text">Awesome Web Browsers</text>
    <!-- Subtitle -->
    <text x="62" y="36" class="subtitle-text">Curated Ecosystem of SaaS Platforms, Open-Source Engines &amp; Privacy Tools</text>
  </g>
</svg>
